<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a1a; /* Тот же фон */
            color: white;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Сайдбар в стиле основной темы */
        .sidebar {
            width: 260px;
            background-color: #2d2d2d; /* Цвет карточки регистрации */
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 30px 15px;
        }

        .sidebar h2 {
            color: #4CAF50; /* Тот самый зеленый */
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.5em;
        }

        .nav-link {
            color: #bbb;
            text-decoration: none;
            padding: 12px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: 0.3s;
            display: block;
        }

        .nav-link:hover {
            background-color: #333;
            color: #4CAF50;
        }

        .nav-link.active {
            background-color: #4CAF50;
            color: white;
        }

        /* Основной контент */
        .main-content {
            flex-grow: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Блоки-карточки (стиль как у регистрации) */
        .card {
            background-color: #2d2d2d;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-top: 4px solid #4CAF50; /* Зеленая полоска сверху */
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1, h2, h3 { margin: 0; }

        /* Сетка курсов внутри главной */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .course-item {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
            transition: 0.3s;
        }

        .course-item:hover {
            border-color: #4CAF50;
            transform: translateY(-3px);
        }

        .btn-action {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9em;
        }

        /* Стиль для дедлайнов (розовый из рекавери) */
        .deadline-card {
            border-top: 4px solid #f08080;
        }

        .logout {
            margin-top: auto;
            color: #f08080 !important;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>School</h2>
        <a href="/main" class="nav-link active">🏠 Главная</a>
        <a href="/profile" class="nav-link">👤 Профиль</a>
        <a href="/courses" class="nav-link">📚 Курсы</a>
        <a href="/chats" class="nav-link">💬 Чаты</a>
        <hr style="width: 80%; border: 0.5px solid #444; margin: 20px auto;">
        <a href="/" class="nav-link logout">🚪 Выйти</a>
    </div>

    <div class="main-content">

        <div class="card">
            <div class="card-header">
                <h1>Привет, {{ username }}!</h1>
                <span style="color: #888;">Сегодня 20 марта</span>
            </div>
            <p style="color: #ccc;">Рады видеть тебя снова!</p>
        </div>

        <div class="card deadline-card">
            <h3>🔔 Ближайшие события</h3>
            <ul style="list-style: none; padding: 0; margin-top: 15px;">
                <li style="padding: 10px 0; border-bottom: 1px solid #444;">
                </li>
            </ul>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>Твои курсы</h3>
                <a href="/courses" style="color: #4CAF50; text-decoration: none; font-size: 0.9em;">Смотреть все</a>
            </div>
            <div class="courses-grid">
                <div class="course-item">
                    <a href="/courses" style="color: #4CAF50; text-decoration: none; font-size: 0.9em;">+</a>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
