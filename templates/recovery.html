<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление - Онлайн Школа</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-card {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            width: 320px;
            text-align: center;
            /* Розовый акцент по твоей схеме */
            border-top: 4px solid #f08080;
        }
        h2 {
            color: #f08080;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #444;
            background: #333;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #f08080;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #f08080;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #e07070;
        }
        .links {
            margin-top: 20px;
            font-size: 0.9em;
        }
        a {
            color: #888;
            text-decoration: none;
        }
        a:hover {
            color: #f08080;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Восстановление</h2>
        <p style="font-size: 0.8em; color: #aaa; margin-bottom: 15px;">
            Введите почту, чтобы получить код доступа
        </p>

        <form action="/auth" method="get">
            <input type="email" placeholder="Почта" required>
            <input type="text" placeholder="Код из письма" required>
            <input type="password" placeholder="Новый пароль" required>

            <button type="submit">Сменить и войти</button>
        </form>

        <div class="links">
            <p><a href="/auth">← Вернуться ко входу</a></p>
        </div>
    </div>

</body>
</html>
