<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация - Онлайн Школа</title>
    <style>
        /* Немного простого стиля, чтобы всё было по центру */
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a; /* Темный фон, как на твоей схеме */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-card {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 300px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: white;
            box-sizing: border-box; /* Чтобы паддинги не раздували инпут */
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50; /* Зеленый цвет как на схеме */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #45a049;
        }
        .links {
            margin-top: 15px;
            font-size: 0.8em;
        }
        a {
            color: #888;
            text-decoration: none;
        }
        a:hover {
            color: #4CAF50;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Вход</h2>
        <form action="/main" method="get"> <input type="text" placeholder="Логин или Почта" required>
            <input type="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>

        <div class="links">
            <p><a href="/recovery">Забыл пароль?</a></p>
            <p>Нет аккаунта? <a href="#">Регистрация</a></p>
            <hr>
            <p><a href="/">← Назад "О нас"</a></p>
        </div>
    </div>

</body>
</html>
